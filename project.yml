# XcodeGen spec. Generates LivelyReading.xcodeproj from the source tree so the
# project file never has to be hand-edited or committed.
#
#   brew install xcodegen   # once
#   xcodegen generate && open LivelyReading.xcodeproj
#
name: LivelyReading
options:
  bundleIdPrefix: com.livelyreading
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""            # set your Apple Team ID in Xcode to run on device
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO

targets:
  LivelyReading:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: LivelyReading
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.livelyreading.app
        PRODUCT_NAME: LivelyReading
        INFOPLIST_FILE: LivelyReading/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        ENABLE_PREVIEWS: YES
